name: 🗻 Acceso a la fortaleza prohibida

# on: push
on:
  workflow_dispatch:

jobs:
  acceso-a-la-base:
    runs-on: ubuntu-latest

    steps:
      - name: El agente llega a la fortaleza
        run: |
          echo "Agente ${{ github.actor }} llega a la fortaleza"
          echo "Buscar los archivos de la Legión"
          ls -la
          echo ""
          echo "❌ Pero... ¿qué pasó? No hay nada"

      - name: Brainiac desbloquea la bóveda
        uses: actions/checkout@v4

      - name: Ahora sí, vamos a ver los planes
        run: |
          echo "ARCHIVOS DE LA LEGIÓN"
          echo "====================="
          ls -la
          echo ""
          echo "✅ Acceso concedido"

          echo ""
          echo "Planes:"
          ls planes/

          echo ""
          echo "Miembros:"
          ls miembros/

          echo ""
          echo "Inteligencia:"
          ls inteligencia/

      - name: Analizar registros de la fortaleza
        run: |
          echo "REGISTROS DE LA FORTALEZA"
          echo "=========================="
          echo ""
          echo "Repositorio: ${{ github.repository }}"
          echo "Agente: ${{ github.actor }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Último commit:"
          git log -1 --oneline

      - name: Escanear la fortaleza
        run: |
          echo "ESCANEO DE LA FORTALEZA"
          echo "========================"
          echo ""
          echo "Cantidad total de archivos:"
          find . -type f | wc -l
          echo ""
          echo "Estructura encontrada:"
          find . -maxdepth 2 -type f

      - name: Acceso completado
        run: |
          echo "================================"
          echo "🟢 OPERACIÓN COMPLETADA"
          echo "La fortaleza ha sido inspeccionada"
          echo "================================"