name: Reclutamiento de agentes

on: push

jobs:
  reporte-de-reclutamientos:
    runs-on: ubuntu-latest

    steps:
      - name: El agente se presenta
        run: echo "Soy Lex Luthor, y el lider de la Legión del Mal"

      - name: Reporte de identidad
        run: |
          echo "REPORTE DE IDENTIDAD"
          echo "===================="
          echo ""
          echo "Agente: ${{ github.actor }}"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama o referencia: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Número de ejecución: ${{ github.run_number }}"

      - name: Capacidades del agente
        run: |
          echo "CAPACIDADES DEL AGENTE"
          echo "======================"
          echo ""

          echo "Sistema operativo:"
          lsb_release -d
          echo ""

          echo "Kernel:"
          uname -r
          echo ""

          echo "Git:"
          git --version
          echo ""

          echo "Node.js:"
          node --version
          echo ""

          echo "NPM:"
          npm --version
          echo ""

          echo "Python:"
          python --version
          echo ""

          echo "Java:"
          java -version
          echo ""

          echo "Docker:"
          docker --version
          echo ""

          echo "CPU disponibles:"
          nproc
          echo ""

          echo "Memoria disponible:"
          free -h

      - name: Reconocimiento del terreno
        run: |
          echo "RECONOCIMIENTO DEL TERRENO"
          echo "=========================="
          echo ""

          echo "Directorio actual:"
          pwd
          echo ""

          echo "Archivos y directorios encontrados:"
          ls -la

      - name: Misión completada
        run: |
          echo "=========================="
          echo "RECLUTAMIENTO COMPLETADO"
          echo "Bienvenido a la Legión del Mal"
          echo "=========================="