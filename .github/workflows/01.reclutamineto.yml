name: Reclutamiento de agentes

on: push

jobs:
  reporte-de-reclutamientos:
    runs-on: ubuntu-latest

    steps:
      - name: El agente se presenta
        run: echo "Soy Lex Luthor, y el lider de la Legión del Mal"

      - name: Reporte de identidad
        run: |
          echo "REPORTE DE IDENTIDAD"
          echo "===================="
          echo ""
          echo "Agente: ${{ github.actor }}"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama o referencia: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Número de ejecución: ${{ github.run_number }}"

      - name: Información del sistema
        run: |
          echo "INFORMACIÓN DEL SISTEMA"
          echo "======================="
          echo "Sistema operativo:"
          uname -a
          echo ""
          echo "Directorio actual:"
          pwd
          echo ""
          echo "Archivos disponibles:"
          ls -la

      - name: Misión completada
        run: |
          echo "=========================="
          echo "RECLUTAMIENTO COMPLETADO"
          echo "Bienvenido a la Legión del Mal"
          echo "=========================="
